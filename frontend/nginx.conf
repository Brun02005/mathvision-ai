# Per-IP request rate for the API (10 per second, bursts of 30): stops floods before they reach Python
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Must be >= MAX_UPLOAD_MB in the backend
    client_max_body_size 12m;

    # Security headers. nginx drops server-level add_header in any location that has its
    # own add_header, so each location below repeats them.
    #   CSP: only our own scripts; styles need 'unsafe-inline' for KaTeX and React style
    #   attributes; Supabase Auth is the only other origin the page talks to.
    #   HSTS belongs on the server that terminates TLS (hosting platform / load balancer).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwrite, never append: the backend trusts this header for per-IP limits
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: unknown routes (/history/3, /cuenta) fall back to index.html; the HTML is never cached
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;
    }
}
